schema_version: 1

# Copy this file to agent-vm.yaml, set the required values, and run chmod 600.
NB_HOSTNAME: agent-vm
NB_MANAGEMENT_URL: 
NB_SETUP_KEY: replace-with-the-setup-key
STRIPE_API_KEY: replace-with-a-stripe-api-key
PR_AGENT_GITHUB_APP_ID: 123456
PR_AGENT_GITHUB_PRIVATE_KEY: |-
  -----BEGIN RSA PRIVATE KEY-----
  replace-with-the-github-app-private-key
  -----END RSA PRIVATE KEY-----

vm:
  name: agent-vm
  architecture: x86_64
  vcpus: 4
  memory_gib: 16
  disk_gib: 100
  libvirt_network: default
  os_variant: ubuntu24.04
  image:
    url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
    checksum_url: https://cloud-images.ubuntu.com/noble/current/SHA256SUMS

guest:
  user: agent
  workspace_dir: /home/agent/workspaces
  timezone: Europe/Zurich
  console_agent_password: replace-with-an-agent-console-password
  console_root_password: replace-with-a-console-root-password

ports:
  kandev: 38429
  bifrost: 8080
  cliproxyapi: 8317
  pr_agent: 3000

services:
  nvm:
    version: v0.40.3
  uv:
    version: 0.12.7
  node_major: 24
  kandev:
    npm_package: kandev
  pi:
    npm_package: "@earendil-works/pi-coding-agent"
    default_model: gpt-5.6-sol
  bifrost:
    npm_package: "@maximhq/bifrost"
  cliproxyapi:
    github_repository: router-for-me/CLIProxyAPI
    asset_pattern: "CLIProxyAPI_.*_linux_amd64\\.tar\\.gz$"
  pr_agent:
    enabled: true
    pypi_package: pr-agent
    model: cliproxy/codex-auto-review
    fallback_model: cliproxy/gpt-5.6-sol
    workers: 2

local:
  state_dir: .state
  cache_dir: .cache
