schema_version: 1

# Copy this file to agent-vm.yaml, set the required values, and run chmod 600.
NB_HOSTNAME: agent-vm
NB_MANAGEMENT_URL: 
NB_SETUP_KEY: replace-with-the-setup-key
STRIPE_API_KEY: replace-with-a-stripe-api-key

vm:
  name: agent-vm
  architecture: x86_64
  vcpus: 4
  memory_gib: 16
  disk_gib: 100
  libvirt_network: default
  os_variant: ubuntu24.04
  image:
    url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
    checksum_url: https://cloud-images.ubuntu.com/noble/current/SHA256SUMS

guest:
  user: agent
  workspace_dir: /home/agent/workspaces
  timezone: Europe/Zurich
  console_agent_password: replace-with-an-agent-console-password
  console_root_password: replace-with-a-console-root-password
  git:
    sign_commits: true
    name: Replace With Your Name
    email: replace-with-your-verified-email@example.com

ports:
  kandev: 38429
  cliproxyapi: 8317

services:
  nvm:
    version: v0.40.3
  uv:
    version: 0.12.7
  node_major: 24
  corepack_version: 0.35.0
  node_versions: [24.7.0]
  kandev:
    npm_package: kandev
    repositories:
      - {name: whatsin.fyi, preset: whatsin-fyi}
      - {name: services, preset: compose}
    workflow_sync:
      enabled: true
      provider: github
      workspace_name: Default
      repo_owner: polaroidkidd
      repo_name: agent-vm
      branch: master
      path: workflows
      interval_seconds: 300
      poll_enabled: true
  pi:
    npm_package: "@earendil-works/pi-coding-agent"
    superpowers_package: "@weiping/pi-superpowers"
    default_model: gpt-5.6-sol
  cliproxyapi:
    github_repository: router-for-me/CLIProxyAPI
    asset_pattern: "CLIProxyAPI_.*_linux_amd64\\.tar\\.gz$"

local:
  state_dir: .state
  cache_dir: .cache
